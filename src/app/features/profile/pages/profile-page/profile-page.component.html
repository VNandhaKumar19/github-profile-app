<header class="profile-header">
    @if (user()) {
    <app-nav-tabs [username]="username" [repoCount]="user()!.public_repos"></app-nav-tabs>
    }
</header>

<div class="profile-page-container">

    @if (isLoading()) {
    <p class="loading-message">Loading profile...</p>
    } @else if (error()) {
    <p class="error-message">{{ error() }}</p>
    } @else if (user()) {
    <div class="profile-main-content">

        <div class="profile-sidebar">
            <app-profile-card [user]="user()!"></app-profile-card>
        </div>

        <div class="profile-content">
            <router-outlet></router-outlet>

            <div class="tab-content-placeholder">
                <h2>Overview Content</h2>
                <p>Welcome to the overview. Contributions and Pinned Repositories will appear here.</p>
            </div>
        </div>

    </div>
    }
</div>
